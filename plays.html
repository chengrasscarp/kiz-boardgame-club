<head>
  <meta charset="UTF-8">

  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.ico">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">🎲 KIZ桌游协会</a>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">首页</a>
      <a href="games.html">游戏库</a>
      <a href="plays.html" class="active">活动记录</a>
      <a href="members.html">成员墙</a>

      <a href="report.html">周报</a>
      <a href="dashboard.html">数据看板</a>
      <a href="about.html">关于我们</a>
    </div>
  </div>
</nav>

<section class="page-section">
  <h1 class="section-title">📋 活动记录</h1>
  <p class="section-subtitle" id="playCount">--场对局</p>
  <div class="filter-bar">
    <select id="playGameFilter">
      <option value="">全部游戏</option>
    </select>
    <select id="playLocationFilter">
      <option value="">全部地点</option>
    </select>
    <select id="playPlayerFilter">
      <option value="">全部玩家</option>
    </select>
    <select id="playPlayer2Filter">
      <option value="">同局玩家（可选）</option>
    </select>
    <div class="filter-search-wrap">
      <input type="text" id="playSearch" class="filter-search" placeholder="搜索游戏名（简/繁通用）">
      <button type="button" id="playSearchClear" class="filter-clear-btn" title="清除搜索">✕</button>
    </div>
    <div class="filter-month">
      <label class="filter-month-label">月份</label>
      <select id="playMonthFilter">
        <option value="">不限</option>
      </select>
      <button type="button" id="playMonthPrev" class="filter-month-btn" title="上个月">‹</button>
      <button type="button" id="playMonthNext" class="filter-month-btn" title="下个月">›</button>
    </div>
    <div class="filter-date">
      <span class="filter-date-label">日期</span>
      <input type="date" id="playFromDate" title="开始日期">
      <span class="filter-date-sep">至</span>
      <input type="date" id="playToDate" title="结束日期">
      <button type="button" id="playDateClear" class="filter-clear-btn">清除</button>
    </div>
  </div>
  <div class="timeline" id="playTimeline"></div>
  <div class="load-more" id="loadMoreContainer">
    <button id="loadMoreBtn">加载更多</button>
  </div>
</section>

<footer class="footer">
  <p>© KIZ桌游协会 · 茨坝人才公寓405 · 骰子一掷，友谊长存 🎲</p>
</footer>

<script src="js/data.js"></script>
<script src="js/main.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    initNavigation();
    renderPlayRecords();
  });
</script>
</body>
</html>
