<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo">🎲 KIZ桌游协会</a>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">☰</button>
    <div class="nav-links" id="navLinks">
      <a href="index.html">首页</a>

  <p class="section-subtitle" id="gameCount">--款桌游，总有一款适合你</p>
  <div class="filter-bar">
    <input type="text" id="gameSearch" placeholder="🔍 搜索游戏名称...">
    <select id="gameSort">
      <option value="plays">按游玩次数</option>
      <option value="name">按名称</option>

      <option value="rating">按BGG评分</option>
      <option value="rank">按BGG排名</option>
      <option value="complexity">按复杂度</option>
    </select>
  </div>
  <div class="game-grid" id="gameGrid"></div>
  <div class="no-results" id="noResults" style="display:none;">没有找到匹配的游戏 😢</div>
